services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetapp-container
    ports:
      - 3000:3000
    restart: always
    env_file:
      - .env
  drizzle-db:
    image: postgres
    restart: always
    container_name: drizzle-db
    ports:
      - "5432:5432"
    env_file:
      - .env
      